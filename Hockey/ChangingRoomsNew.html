<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16843a">
  <title>Chelmsford Hockey Club | Changing Rooms</title>

  <style>
    :root {
      --club-green: #16843a;
      --club-green-dark: #0d5f29;
      --club-green-soft: #eaf6ee;
      --ink: #17211b;
      --muted: #607066;
      --line: #d9e3dc;
      --panel: #ffffff;
      --page: #f4f7f5;
      --danger: #b42318;
      --shadow: 0 8px 24px rgba(10, 55, 28, 0.10);
      --fixture-row-height: 88px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, select { font: inherit; }

    .site-header {
      background: linear-gradient(135deg, var(--club-green-dark), var(--club-green));
      color: #fff;
      padding: 20px 28px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 2;
    }

    .site-header__title {
      margin: 0;
      text-align: center;
      font-size: clamp(28px, 3vw, 48px);
      line-height: 1.1;
    }

    .site-header__subtitle {
      margin: 6px 0 0;
      text-align: center;
      font-size: clamp(14px, 1.3vw, 20px);
      opacity: 0.95;
    }

    .header-spacer { min-width: 1px; }

    .status {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      font-size: 14px;
      white-space: nowrap;
    }

    .status__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 0 4px rgba(255,209,102,.18);
    }

    .status[data-state="online"] .status__dot { background: #8ef0ad; }
    .status[data-state="offline"] .status__dot { background: #ff9b92; }

    main {
      flex: 1;
      width: 100%;
      padding: 22px;
    }

    .board {
      max-width: 1920px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(150px, 17%) minmax(0, 1fr) minmax(150px, 17%);
      gap: 16px;
      align-items: start;
    }

    .room-panel, .fixtures-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-heading {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: var(--club-green-soft);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .panel-heading h2 {
      margin: 0;
      color: var(--club-green-dark);
      font-size: clamp(18px, 1.6vw, 28px);
    }

    .room-list {
      display: grid;
      grid-auto-rows: var(--fixture-row-height);
      padding: 8px;
    }

    .room-row {
      min-height: var(--fixture-row-height);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--line);
    }

    .room-row:last-child { border-bottom: 0; }

    .room-select {
      width: min(130px, 92%);
      min-height: 58px;
      padding: 8px 36px 8px 12px;
      border: 2px solid var(--club-green);
      border-radius: 12px;
      background: #fff;
      color: var(--club-green-dark);
      font-size: clamp(26px, 3vw, 48px);
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .room-select:focus-visible, .control-button:focus-visible {
      outline: 4px solid rgba(22,132,58,.25);
      outline-offset: 2px;
    }

    .room-select:disabled {
      opacity: 1;
      cursor: default;
      color: var(--club-green-dark);
      background: #fff;
      -webkit-text-fill-color: var(--club-green-dark);
    }

    .fixtures-content {
      min-height: 160px;
      padding: 8px 12px;
      overflow: hidden;
    }

    #gmsFixtures { width: 100%; }

    .loading, .empty-message {
      min-height: 144px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 20px;
      padding: 24px;
    }

    .controls {
      max-width: 1920px;
      margin: 16px auto 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      min-height: 42px;
    }

    .control-button {
      border: 1px solid var(--club-green-dark);
      border-radius: 10px;
      padding: 10px 14px;
      background: #fff;
      color: var(--club-green-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .control-button:hover { background: var(--club-green-soft); }
    .control-button[data-active="true"] { background: var(--club-green-dark); color: #fff; }

    .save-message {
      margin-right: auto;
      color: var(--muted);
      font-size: 14px;
    }

    .save-message.error { color: var(--danger); }

    .sponsors-section {
      margin-top: 22px;
      background: #fff;
      border-top: 8px solid var(--club-green);
      padding: 20px 22px 26px;
    }

    .sponsors-section h2 {
      margin: 0 0 18px;
      text-align: center;
      color: var(--club-green-dark);
      font-size: clamp(22px, 2.2vw, 34px);
    }

    .sponsor-grid {
      max-width: 1500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 18px 28px;
      align-items: center;
    }

    .sponsor {
      min-height: 92px;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .sponsor img {
      display: block;
      max-width: 100%;
      max-height: 88px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .site-footer {
      min-height: 190px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 24px;
      background: #dce9df url('footer.png') center / cover no-repeat;
      color: #102218;
      text-align: center;
    }

    #datetime {
      margin: 0;
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(255,255,255,.86);
      font-size: clamp(22px, 3vw, 46px);
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    @media (max-width: 900px) {
      .site-header { grid-template-columns: 1fr; }
      .header-spacer { display: none; }
      .status { justify-self: center; }
      .board { grid-template-columns: 105px minmax(0, 1fr) 105px; gap: 7px; }
      main { padding: 9px; }
      .fixtures-content { padding: 5px; }
      .room-select { min-height: 50px; padding: 5px; font-size: 26px; }
      .sponsor-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      :root { --fixture-row-height: 76px; }
      .board { grid-template-columns: 78px minmax(0, 1fr) 78px; }
      .panel-heading { min-height: 62px; padding: 6px; }
      .panel-heading h2 { font-size: 14px; }
      .room-list { padding: 3px; }
      .room-select { width: 68px; font-size: 22px; border-width: 1px; }
      .sponsor-grid { grid-template-columns: repeat(2, 1fr); }
      .controls { flex-wrap: wrap; }
      .save-message { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-spacer" aria-hidden="true"></div>
    <div>
      <h1 class="site-header__title">Welcome to Chelmsford Hockey Club</h1>
      <p class="site-header__subtitle">Today's home fixtures and changing-room allocations</p>
    </div>
    <div id="connectionStatus" class="status" data-state="checking" role="status" aria-live="polite">
      <span class="status__dot" aria-hidden="true"></span>
      <span id="connectionText">Loading allocations</span>
    </div>
  </header>

  <main>
    <div class="board">
      <aside class="room-panel" aria-labelledby="homeRoomsHeading">
        <div class="panel-heading"><h2 id="homeRoomsHeading">Home changing room</h2></div>
        <div id="dynamicDropdownsLeft" class="room-list"></div>
      </aside>

      <section class="fixtures-panel" aria-labelledby="fixturesHeading">
        <div class="panel-heading"><h2 id="fixturesHeading">Fixtures</h2></div>
        <div class="fixtures-content">
          <div id="gmsFixtures"
               class="gms-wrapper gms-ajax"
               data-method="api"
               data-show="fixtures+results"
               data-club_id="e9ba26d3-7e18-4772-abb0-584e887c9d38"
               data-sort_by="fixtureTime"
               data-options="showGender:yes, showList:yes, filter:home">
          </div>
        </div>
      </section>

      <aside class="room-panel" aria-labelledby="awayRoomsHeading">
        <div class="panel-heading"><h2 id="awayRoomsHeading">Away changing room</h2></div>
        <div id="dynamicDropdownsRight" class="room-list"></div>
      </aside>
    </div>

    <div class="controls" aria-label="Changing-room controls">
      <span id="saveMessage" class="save-message" aria-live="polite"></span>
      <button id="refreshButton" class="control-button" type="button">Refresh</button>
      <button id="editButton" class="control-button" type="button" data-active="false">Enable editing</button>
    </div>
  </main>

  <section class="sponsors-section" aria-labelledby="sponsorsHeading">
    <h2 id="sponsorsHeading">Thank you to our sponsors</h2>
    <div class="sponsor-grid">
      <div class="sponsor"><img src="img/sponsors/gray and sons.png" alt="Gray and Sons"></div>
      <div class="sponsor"><img src="img/sponsors/skippers.png" alt="Skippers"></div>
      <div class="sponsor"><img src="img/sponsors/birketts.png" alt="Birketts"></div>
      <div class="sponsor"><img src="img/sponsors/green recycling.png" alt="Green Recycling"></div>
      <div class="sponsor"><img src="img/sponsors/st-cedds.png" alt="St Cedd's"></div>
      <div class="sponsor"><img src="img/sponsors/new-hall.png" alt="New Hall"></div>
      <div class="sponsor"><img src="img/sponsors/old_park_meadow.svg" alt="Old Park Meadow"></div>
      <div class="sponsor"><img src="img/sponsors/meadow-oak.png" alt="Meadow Oak"></div>
      <div class="sponsor"><img src="img/sponsors/stonebondlogo.png" alt="Stonebond"></div>
    </div>
  </section>

  <footer class="site-footer">
    <p id="datetime"></p>
  </footer>

  <script>
    'use strict';

    /*
      Expected serverless endpoint:
        GET  /api/allocations
          Response: { "allocations": { "dropdownLeft1": "1", "dropdownRight1": "2" } }
          The bare allocation object is also accepted.

        PUT /api/allocations
          Body: { "allocations": { ... }, "updatedAt": "ISO timestamp" }

      If the API is unavailable, this page continues to work using localStorage.
      Change API_URL below only if your serverless route uses a different address.
    */
    const CONFIG = Object.freeze({
      API_URL: '/api/allocations',
      ROOM_NUMBERS: ['1', '2', '3', '4', '5', '6'],
      LOCAL_STORAGE_KEY: 'chc-changing-room-allocations-v2',
      REMOTE_POLL_MS: 30000,
      FIXTURE_WAIT_MS: 30000,
      SAVE_DEBOUNCE_MS: 350,
      DEFAULT_ROOM: '',
      EDIT_QUERY_PARAMETER: 'edit'
    });

    const state = {
      allocations: {},
      fixtureCount: 0,
      editing: new URLSearchParams(window.location.search).get(CONFIG.EDIT_QUERY_PARAMETER) === '1',
      saveTimer: null,
      fixtureObserver: null,
      fixtureTimeout: null
    };

    const elements = {
      fixtureHost: document.getElementById('gmsFixtures'),
      fixtureLoading: document.getElementById('gmsLoading'),
      left: document.getElementById('dynamicDropdownsLeft'),
      right: document.getElementById('dynamicDropdownsRight'),
      status: document.getElementById('connectionStatus'),
      statusText: document.getElementById('connectionText'),
      saveMessage: document.getElementById('saveMessage'),
      refreshButton: document.getElementById('refreshButton'),
      editButton: document.getElementById('editButton'),
      datetime: document.getElementById('datetime')
    };

    function safeParse(value, fallback = {}) {
      try { return JSON.parse(value); } catch { return fallback; }
    }

    function normaliseAllocations(value) {
      const source = value && typeof value === 'object' && value.allocations
        ? value.allocations
        : value;
      if (!source || typeof source !== 'object' || Array.isArray(source)) return {};

      const clean = {};
      for (const [key, room] of Object.entries(source)) {
        const roomValue = String(room ?? '');
        if (/^dropdown(Left|Right)\d+$/.test(key) &&
            (roomValue === '' || CONFIG.ROOM_NUMBERS.includes(roomValue))) {
          clean[key] = roomValue;
        }
      }
      return clean;
    }

    function readLocalAllocations() {
      return normaliseAllocations(safeParse(localStorage.getItem(CONFIG.LOCAL_STORAGE_KEY), {}));
    }

    function writeLocalAllocations() {
      localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify(state.allocations));
    }

    function setConnectionStatus(status, text) {
      elements.status.dataset.state = status;
      elements.statusText.textContent = text;
    }

    function setSaveMessage(text, isError = false) {
      elements.saveMessage.textContent = text;
      elements.saveMessage.classList.toggle('error', isError);
    }

    async function fetchRemoteAllocations({ quiet = false } = {}) {
      try {
        const response = await fetch(CONFIG.API_URL, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`GET ${response.status}`);

        const data = await response.json();
        state.allocations = normaliseAllocations(data);
        writeLocalAllocations();
        applyAllocationsToControls();
        setConnectionStatus('online', 'Shared allocations connected');
        if (!quiet) setSaveMessage('Allocations loaded.');
        return true;
      } catch (error) {
        state.allocations = readLocalAllocations();
        applyAllocationsToControls();
        setConnectionStatus('offline', 'Local mode');
        if (!quiet) setSaveMessage('Shared service unavailable. Using this device only.', true);
        console.warn('Could not load shared allocations:', error);
        return false;
      }
    }

    async function saveRemoteAllocations() {
      writeLocalAllocations();
      setSaveMessage('Saving…');

      try {
        const response = await fetch(CONFIG.API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            allocations: state.allocations,
            updatedAt: new Date().toISOString()
          })
        });
        if (!response.ok) throw new Error(`PUT ${response.status}`);

        setConnectionStatus('online', 'Shared allocations connected');
        setSaveMessage('Saved for all screens.');
      } catch (error) {
        setConnectionStatus('offline', 'Saved on this device');
        setSaveMessage('Saved on this device only. Shared service unavailable.', true);
        console.warn('Could not save shared allocations:', error);
      }
    }

    function queueSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(saveRemoteAllocations, CONFIG.SAVE_DEBOUNCE_MS);
    }

    function createRoomSelect(side, index) {
      const id = `dropdown${side}${index}`;
      const row = document.createElement('div');
      row.className = 'room-row';

      const select = document.createElement('select');
      select.className = 'room-select';
      select.id = id;
      select.dataset.side = side;
      select.dataset.fixtureIndex = String(index);
      select.setAttribute('aria-label', `${side === 'Left' ? 'Home' : 'Away'} changing room for fixture ${index}`);

      const unallocated = document.createElement('option');
      unallocated.value = '';
      unallocated.textContent = '–';
      unallocated.setAttribute('aria-label', 'Not allocated');
      select.appendChild(unallocated);

      for (const room of CONFIG.ROOM_NUMBERS) {
        const option = document.createElement('option');
        option.value = room;
        option.textContent = room;
        select.appendChild(option);
      }

      select.value = state.allocations[id] ?? CONFIG.DEFAULT_ROOM;
      select.disabled = !state.editing;
      select.addEventListener('change', () => {
        state.allocations[id] = select.value;
        queueSave();
      });

      row.appendChild(select);
      return row;
    }

    function renderRoomControls(count) {
      if (count === state.fixtureCount && elements.left.children.length === count) {
        applyAllocationsToControls();
        return;
      }

      state.fixtureCount = count;
      elements.left.replaceChildren();
      elements.right.replaceChildren();

      for (let index = 1; index <= count; index += 1) {
        elements.left.appendChild(createRoomSelect('Left', index));
        elements.right.appendChild(createRoomSelect('Right', index));
      }

      updateEditingState();
      syncRowHeights();
    }

    function applyAllocationsToControls() {
      document.querySelectorAll('.room-select').forEach(select => {
        const nextValue = state.allocations[select.id] ?? CONFIG.DEFAULT_ROOM;
        if ([...select.options].some(option => option.value === nextValue)) {
          select.value = nextValue;
        }
      });
    }

    function getFixtureCards() {
      const preferredSelectors = ['.gms-card', '.gms-fixture', '.gms-list-item', 'article'];
      for (const selector of preferredSelectors) {
        const cards = [...elements.fixtureHost.querySelectorAll(selector)];
        if (cards.length) return cards;
      }
      return [];
    }

    function syncRowHeights() {
      const cards = getFixtureCards();
      if (!cards.length) return;

      requestAnimationFrame(() => {
        const leftRows = [...elements.left.children];
        const rightRows = [...elements.right.children];
        cards.forEach((card, index) => {
          const height = Math.max(70, Math.ceil(card.getBoundingClientRect().height));
          if (leftRows[index]) leftRows[index].style.height = `${height}px`;
          if (rightRows[index]) rightRows[index].style.height = `${height}px`;
        });
      });
    }

    function inspectFixtures() {
      const cards = getFixtureCards();
      if (!cards.length) return false;

      elements.fixtureLoading.hidden = true;
      renderRoomControls(cards.length);
      clearTimeout(state.fixtureTimeout);
      return true;
    }

    function watchForFixtures() {
      if (inspectFixtures()) return;

      state.fixtureObserver = new MutationObserver(() => inspectFixtures());
      state.fixtureObserver.observe(elements.fixtureHost, { childList: true, subtree: true });

      state.fixtureTimeout = setTimeout(() => {
        if (!inspectFixtures()) {
          elements.fixtureLoading.className = 'empty-message';
          elements.fixtureLoading.textContent = 'No home fixtures are currently available from the GMS feed.';
          renderRoomControls(0);
        }
      }, CONFIG.FIXTURE_WAIT_MS);
    }

    function updateEditingState() {
      document.querySelectorAll('.room-select').forEach(select => {
        select.disabled = !state.editing;
      });
      elements.editButton.dataset.active = String(state.editing);
      elements.editButton.textContent = state.editing ? 'Finish editing' : 'Enable editing';
    }

    function updateDateTime() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      const date = now.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      elements.datetime.textContent = `${time} · ${date}`;
    }

    elements.editButton.addEventListener('click', () => {
      state.editing = !state.editing;
      updateEditingState();
      setSaveMessage(state.editing ? 'Editing enabled.' : 'Editing locked.');
    });

    elements.refreshButton.addEventListener('click', async () => {
      await fetchRemoteAllocations();
      inspectFixtures();
    });

    window.addEventListener('resize', syncRowHeights);
    window.addEventListener('storage', event => {
      if (event.key === CONFIG.LOCAL_STORAGE_KEY) {
        state.allocations = readLocalAllocations();
        applyAllocationsToControls();
      }
    });

    updateDateTime();
    setInterval(updateDateTime, 30000);

    state.allocations = readLocalAllocations();
    updateEditingState();
    fetchRemoteAllocations();
    setInterval(() => fetchRemoteAllocations({ quiet: true }), CONFIG.REMOTE_POLL_MS);
    watchForFixtures();
  </script>

  <script src="https://gmsfeed.co.uk/js/api.js" async></script>
</body>
</html>
